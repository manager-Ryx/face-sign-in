name: release

# Builds and releases the Windows installer whenever a `v*` tag is pushed.
# If the repo has configured the SIGNPATH_* secrets, the installer is
# code-signed through SignPath.io's free open-source program. Otherwise
# the unsigned installer is published directly (users will see a
# SmartScreen "unknown publisher" prompt the first time they run it —
# README documents how to bypass).
#
#     git tag v0.1.0
#     git push origin v0.1.0
# ...triggers this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create a GitHub Release

jobs:
  build:
    name: Build + (optional) sign Windows installer
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      SIGNPATH_API_TOKEN:    ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID:       ${{ secrets.SIGNPATH_ORG_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          # The exact versions the app was tested with: newer DeepFace releases, for
          # one, expect different model files than the ones bundled.
          pip install -r installer\requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          # 6.11 can't package NumPy 2.5 (it leaves out numpy._core._exceptions).
          pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Sync installer + app version with tag
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Host "Not a release tag: keeping the version written in the source"
            exit 0
          }
          $ver = $tag.TrimStart('v')
          Write-Host "Stamping app + installer with version $ver"
          # ${1}, not $1: "$1" followed by a version's first digit reads as group 10.
          (Get-Content face_service\_version.py) -replace '(__version__\s*=\s*")[^"]+(")', "`${1}$ver`${2}" | Set-Content face_service\_version.py
          (Get-Content installer\installer.iss) -replace '(#define MyAppVersion ")[^"]+(")', "`${1}$ver`${2}" | Set-Content installer\installer.iss
          python -c "import face_service._version as v; assert v.__version__ == '$ver', v.__version__"
          if (-not (Select-String -Path installer\installer.iss -SimpleMatch "#define MyAppVersion `"$ver`"")) {
            throw "installer.iss was not stamped with $ver"
          }

      - name: Pre-download model weights (photo protection; ArcFace downloads on first start)
        shell: powershell
        run: python installer\download_weights.py

      - name: Build Credential Provider DLL
        shell: powershell
        continue-on-error: true
        run: |
          cd credential_provider
          cmake -B build -A x64 -G "Visual Studio 17 2022"
          cmake --build build --config Release

      - name: Build installer (PyInstaller + Inno Setup)
        shell: powershell
        run: python installer\build.py

      - name: Check the sign-in tile is in the installer
        shell: powershell
        run: |
          # Without it face sign-in can't appear on the lock screen: never publish that.
          if (-not (Test-Path dist\WindowsFaceUnlock\credential_provider\FaceCredentialProvider.dll)) {
            throw "FaceCredentialProvider.dll was not built"
          }

      - name: Smoke-test both programs as built (windowed, empty model folder)
        shell: powershell
        run: |
          # Runs the packaged programs themselves, the way a new PC would: no Python
          # installed, no console, and no models yet (the service downloads them).
          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory "$work\deepface", "$work\home" -Force | Out-Null
          $env:DEEPFACE_HOME = "$work\deepface"
          $env:FACE_UNLOCK_HOME = "$work\home"
          $env:FACE_UNLOCK_PIPE = '\\.\pipe\FaceUnlockSmoke'
          $failed = $false
          foreach ($program in 'face_unlock_tray', 'face_service') {
            $report = "$work\$program.json"
            $p = Start-Process "dist\WindowsFaceUnlock\$program.exe" -ArgumentList '--smoke-test', $report -PassThru
            if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Host "$program timed out"; $failed = $true; continue }
            Write-Host "---- $program (exit $($p.ExitCode))"
            if (Test-Path $report) { Get-Content $report } else { Write-Host 'no report written' }
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'A packaged program failed its smoke test: not publishing.' }

      - name: Detect SignPath config
        id: signcheck
        shell: powershell
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORG_ID -and $env:SIGNPATH_PROJECT_SLUG) {
            "have_signpath=true"  | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "SignPath secrets detected — installer will be signed."
          } else {
            "have_signpath=false" | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "SignPath secrets absent — publishing unsigned installer."
          }

      - name: Upload unsigned installer for SignPath
        if: steps.signcheck.outputs.have_signpath == 'true'
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: installer_output\WindowsFaceUnlock-Setup-*.exe
          retention-days: 1

      - name: Submit to SignPath
        if: steps.signcheck.outputs.have_signpath == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          artifact-configuration-slug: installer
          wait-for-completion: true
          output-artifact-directory: installer_output

      - name: Regenerate checksum (covers signed & unsigned)
        shell: powershell
        run: |
          Get-ChildItem installer_output\WindowsFaceUnlock-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }

      - name: Collect artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            installer_output\WindowsFaceUnlock-Setup-*.exe
            installer_output\WindowsFaceUnlock-Setup-*.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/WindowsFaceUnlock-Setup-*.exe
            installer_output/WindowsFaceUnlock-Setup-*.exe.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
